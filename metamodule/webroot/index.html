<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Meta OverlayFS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container"></div>
    <div id="modal-container"></div>

    <div id="app">
        <div class="orb-layer" aria-hidden="true">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>

        <div class="status-island" id="status-island">
            <div class="island-logo">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polygon points="10 2 2 7 2 13 10 18 18 13 18 7"/>
                    <polygon points="10 6 5 9 5 11 10 14 15 11 15 9"/>
                </svg>
            </div>
            <span class="island-name">Meta OverlayFS</span>
            <div class="island-divider"></div>
            <div class="island-status" id="island-status">
                <span class="live-dot"></span>
                <span id="island-status-text">Loading</span>
            </div>
            <button class="island-refresh" id="global-refresh-btn" aria-label="Refresh">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
            </button>
        </div>

        <main class="app-content">
            <div id="page-content" class="page-content"></div>
        </main>

        <nav class="pill-nav" id="bottom-nav"></nav>
    </div>

    <script>
        window.CONFIG = {
            IMG_FILE: "/data/adb/metamodule/modules.img",
            MNT_DIR: "/data/adb/metamodule/mnt",
            MODULES_DIR: "/data/adb/modules",
            LOG_FILE: "/data/adb/metamodule/overlayfsx.log",
            BINARY: "/data/adb/modules/meta-overlayfsx/overlayfsx"
        };
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
